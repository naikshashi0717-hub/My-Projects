<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Weather's</title>
</head>

<body>

    <div id="fullformat">
        <header>
            <div id="searchPage">

                <label for="searchinput">Search</label>
                <input type="search" id="searchinput" name="searchBar" placeholder="Enter your city" required>
                <button id="searchBtn">Search</button>

                <a href="#" id="loginA">LOGIN</a>
                <a href="#" id="registerA">REGISTER</a>

                <div id="displayCountryInfoContainer">

                    </div>

            </div>


            <div id="weatherSearchPage" style="display: none;">
                <h2>Weather For You</h2>
                <div>

                    <span id="usernameheader"></span>
                </div>


                <div>
                    <label for="weatherinput">Search</label>
                    <input type="search" id="weatherinput" name="searchBar" placeholder="Enter Your City " required>
                    <button id="weatherSearchBtn">Search</button>

                    <button id="logoutBtn">Logout</button>

                    <div id="displayWeatherContainer">

                    </div>
                    <div id="randomcitiesContainer">

                    </div>
                </div>

            </div>
        </header>


        <div id="loginPage" style="display: none;">
            <form action="">
                <h2>login</h2>
                <label for="username">Username : </label>
                <input type="text" id="username" name="username" placeholder="Username" required>

                <label for="email">Email : </label>
                <input type="email" id="email" name="email" placeholder="Email" required>

                <label for="password">Password : </label>
                <input type="password" id="password" name="password" placeholder="Password" required>

                <button id="loginBtn">login</button>
            </form>
        </div>


        <div id="registerPage" style="display: none;">
            <form action="">
                <h2>Register Page</h2>
                <label for="regname">Username : </label>
                <input type="text" id="regname" name="regname" placeholder="Username" required>

                <label for="regemail">Email : </label>
                <input type="email" id="regemail" name="regemail" placeholder="Register Your Email" required>

                <label for="regpassword">Password : </label>
                <input type="password" id="regpassword" name="regpassword" placeholder="Enter Your Password" required>

                <button id="registerBtn">Register</button>
            </form>
        </div>


    </div>

    <script src="weather.js"></script>
</body>

</html>
