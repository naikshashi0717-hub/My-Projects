<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header>
        <p>keep tarcked</p>
    </header>
    <main>
        <p>Add Expense</p>
        <section>
            <div class="container">
                <label for="description">Description</label>
                <div class="descr-conatiner">
                    <input id="description" type="text" name="description" placeholder="Enter Your Spending Item" required>
                </div>

                <label for="amount">Amount</label>
                <div class="descr-conatiner">
                    <input id="amount" type="number" name="amount" placeholder="Enter Your amount" required>
                </div>

                <label for="category">Category</label>
                <div class="descr-conatiner">
                    <select name="category" id="category">Category
                        <option disabled value="select">None</option>
                        <option value="Food">Food</option>
                        <option value="Sales">Sales</option>
                        <option value="Goods">Goods</option>
                        <option value="shopping">Shopping</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <label for="date">Date</label>
                <div class="descr-conatiner">
                    <input id="date" type="date" name="amount" placeholder="Enter Your Spending Item">
                </div>

                <div class="btn">
                    <button id="add-btn">Add Expense</button>
                </div>

                <div id="show-expense"></div>
            </div>
        </section>


        <script src="script.js"></script>
    </main>
</body>

</html>
